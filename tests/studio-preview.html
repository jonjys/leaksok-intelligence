<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Studio · Visuell kontroll</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e3e9f2;font-family:system-ui}iframe{display:block;width:100%;height:100vh;border:0;background:#fff;margin:0 auto}aside{position:fixed;right:12px;bottom:10px;background:#182e50ed;color:#e7efff;border:1px solid #41618d;border-radius:9px;padding:6px 9px;font-size:10px;z-index:100;display:flex;gap:8px;align-items:center}button{border:1px solid #7892b6;background:#263f64;color:white;border-radius:5px;padding:3px 7px;cursor:pointer}</style>
<iframe title="Syntetisk layoutkontroll"></iframe><aside><span id="status">Förbereder syntetiska mätare…</span><button id="desktop">Dator</button><button id="mobile">Mobil</button><button id="list">Lista</button><button id="map">Karta</button></aside>
<script>
(async()=>{
 const status=document.getElementById('status'),frame=document.querySelector('iframe');
 if(location.hostname==='leaksok-intelligence.vercel.app'){status.textContent='Testvyn är endast för förhandsversioner.';return;}
 const pause=()=>new Promise(resolve=>setTimeout(resolve,100));
 const until=async fn=>{for(let n=0;n<100;n++){if(fn())return;await pause();}throw Error('Testvyn kunde inte förberedas.');};
 const cache={};const plain=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 for(let i=0;i<80;i++)cache[plain(`SIGNALVÄGEN ${i+1}, 14732 TUMBA, Sverige`)]={lat:59.19+(i%8)*.00045,lng:17.82+Math.floor(i/8)*.00055,at:Date.now(),source:'synthetic-visual-fixture'};
 localStorage.setItem('leaksok_geocode_v2_exact',JSON.stringify(cache));
 frame.src='/';await new Promise(resolve=>frame.onload=resolve);
 const app=frame.contentWindow,doc=app.document;
 await until(()=>app.LeakApp&&doc.getElementById('profileForm'));
 if(app.LeakApp.state.files.length){status.textContent='Syntetisk arbetsyta återanvänds';return;}
 if(doc.getElementById('profileDialog').open){
   const name=doc.getElementById('profileName');if(!name||name.readOnly){status.textContent='Befintlig profil lämnas orörd';return;}
   name.value='Syntetisk layoutkontroll';doc.getElementById('profileCode').value='layout-test-only';
   doc.getElementById('profileForm').requestSubmit();await until(()=>!doc.getElementById('profileDialog').open);
 }
 const rows=[['Serienummer','Adress','Område','Senaste avläsning','Senaste värde','Genomsnittsvärde','Maxvärde','Infokod']];
 for(let d=0;d<30;d++){const date=new Date(Date.UTC(2026,9,13+d)).toISOString().slice(0,10);
   for(let i=0;i<80;i++){const base=i%7===0?60:5+i%12,value=Math.max(0,base+(i<24&&d>24?8+i%20:0)+(d+i)%3-1);
     rows.push([`8800${String(i).padStart(4,'0')}`,`SIGNALVÄGEN ${i+1} TUMBA 14732`,'TUMBA',`${date} 04:00`,value,base,Math.max(value,base),'']);}}
 const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n');
 await app.LeakApp.handleFiles([new app.File([csv],'Visuell-kontroll-2026-11-11-08-00.csv',{type:'text/csv'})]);
 await until(()=>app.LeakApp.state.meters.length===80);
 doc.querySelector('button[data-view="map"]').click();
 await until(()=>doc.querySelector('#rows tr.row .addr'));
 doc.querySelector('#rows tr.row .addr').click();
 status.textContent='Syntetiska testdata · 80 mätare';
 document.getElementById('desktop').onclick=()=>{frame.style.width='100%';frame.style.height='100vh';};
 document.getElementById('mobile').onclick=()=>{frame.style.width='390px';frame.style.height='844px';};
 document.getElementById('list').onclick=()=>doc.querySelector('button[data-view="list"]').click();
 document.getElementById('map').onclick=()=>doc.querySelector('button[data-view="map"]').click();
})().catch(e=>document.getElementById('status').textContent=e.message);
</script></html>
